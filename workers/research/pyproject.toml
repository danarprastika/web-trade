[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webtrade-research"
version = "0.1.0"
description = "Offline research workloads for the web-trade platform. Non-authoritative by construction."
requires-python = "==3.14.*"
readme = "README.md"

# Pinned exactly, per docs/00_README.md toolchain lifecycle: the latest stable
# security-supported release selected at bootstrap. CI must fail on an unpinned
# dependency or a lockfile drift (docs/02_POLYGLOT_ENGINEERING_STANDARD.md section 10).
#
# NOTE: numpy is used for research numerics ONLY. It is float64 and therefore
# deliberately absent from any authoritative path. Authoritative financial arithmetic
# is Go plus PostgreSQL decimal; no float crosses a financial contract (docs/03).
dependencies = [
    "numpy==2.5.3",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
    "mypy==2.3.1",
    # test_schema_layer_rejects_document_cases in tests/test_canonical.py runs
    # tests/contracts/validate_contracts.py as a subprocess, so these are the two packages that
    # test actually executes: the validator imports jsonschema for validation and `referencing`
    # for the Registry that resolves relative $refs. `referencing` is declared here rather than
    # left to arrive as a transitive dependency of jsonschema, because a direct import of an
    # undeclared package is a missing pin, not a convenience.
    #
    # 4.26.0, not 4.26.1. 4.26.1 does not exist on PyPI - 4.26.0 is the current release - and
    # every `pip install "./workers/research[dev]"` therefore failed to resolve, which took out
    # the research worker's install step, the backtest worker's install that resolves the same
    # dependency set, and the dependency-scan job's python audit, all on a pin nothing had ever
    # installed. 4.26.0 requires referencing>=0.28.4, so 0.37.0 is inside its supported range.
    "jsonschema==4.26.0",
    "referencing==0.37.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/webtrade_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "A", "C4", "DTZ", "T20"]
# S (bandit) is enabled deliberately: research code must not grow credential handling
# or subprocess use. A finding here is an authority-boundary warning, not a style note.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
disallow_untyped_defs = true
