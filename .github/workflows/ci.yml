# Continuous integration gates.
#
# Authority: docs/09_TESTING_AND_RELEASE_EVIDENCE.md section "CI gates", which requires
#   - every merge:        formatting, lint, unit tests, contract validation, SAST, dependency scan
#   - protected branch:  additionally integration tests and artifact build
#   - release candidate:  e2e, performance, fault injection, migration rehearsal,
#                         backup restore, SBOM, provenance signing, security approval
#
# This file implements the first two tiers. The release-candidate tier is deliberately
# NOT stubbed here: those gates need a provisioned environment, real venue sandboxes and
# an approved security review, and a workflow that pretends to run them would produce
# false assurance. They are tracked as WI-118 and WI-119.
#
# Third-party actions are pinned to full commit SHAs, not version tags. A tag is a
# mutable pointer, and a CI pipeline that follows one is a supply-chain hole
# (docs/02_POLYGLOT_ENGINEERING_STANDARD.md section 10). Each SHA below was resolved
# from the GitHub API on 2026-09-28 and is annotated with the tag it came from. Dependabot
# (.github/dependabot.yml) keeps them updated and will open reviewable PRs.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default to read-only. Individual jobs that genuinely need more request it explicitly,
# so the blast radius of a compromised step is visible in review rather than implied by
# a blanket "write-all".
permissions:
  contents: read

concurrency:
  # A new push supersedes an in-flight run for the same ref. Without this, a rapid
  # sequence of pushes burns runner minutes re-testing commits nobody will merge.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Kept in step with toolchain/versions.env. The `toolchain` job asserts the two agree,
  # so this duplication cannot silently rot.
  GO_VERSION: '1.26.2'
  NODE_VERSION: '24.18.0'
  PYTHON_VERSION: '3.14'
  # Exact image tag, never `latest`. Mirrors toolchain/versions.env.
  POSTGRES_IMAGE: postgres:17.11-alpine

jobs:
  # ---------------------------------------------------------------------------
  # Toolchain drift and dependency pinning.
  # Runs first: a drifted toolchain makes every other result untrustworthy, so there is
  # no point spending runner minutes on a build that will be rejected anyway.
  # ---------------------------------------------------------------------------
  toolchain:
    name: toolchain drift + dependency pinning
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Assert pinned toolchain and non-floating dependencies
        run: python scripts/verify_toolchain.py

      - name: Install the CI suite's pinned test dependencies
        # Without this step `python -m pytest` fails on the runner with "No module named
        # pytest": actions/setup-python provides a clean interpreter and this job installed
        # nothing. Every other job installs its own dependencies; this one did not, so the
        # job failed in under a second and the fail-fast left all eleven other jobs skipped.
        # A gate that cannot start must not be mistaken for a gate that passed.
        #
        # PyYAML is the load-bearing pin. tests/ci/test_ci_workflow.py reaches it through
        # pytest.importorskip, so without it that module skips instead of failing and the
        # 28 workflow-integrity tests plus the bash-syntax gate below stop running while CI
        # still reports success.
        run: python -m pip install --disable-pip-version-check -r tests/ci/requirements.txt

      - name: Assert the gate's own tests
        # A CI gate that has silently stopped rejecting bad input is worse than no gate,
        # because it is trusted. The negative cases live in tests/ci.
        run: python -m pytest tests/ci -q

      - name: every run block in this workflow is valid bash
        # This workflow is the repository's definition of what must pass, so a syntax error in one
        # of its own steps is the most expensive cheap failure available: it does not fail here,
        # it fails minutes into a later job on a runner, after the build cache is warm and the
        # developer has moved on.
        #
        # It runs in the toolchain job because that is the first job and it gates everything else,
        # so a broken step is reported before the six-module build and test cycle has spent its
        # time. The check parses with `bash -n` and executes nothing, so it is fast and has no
        # side effects; it skips rather than fails when bash is absent, because a missing
        # interpreter must not be reported as a broken workflow.
        run: python scripts/check_workflow_bash.py

  # ---------------------------------------------------------------------------
  # G0 — Specification Integrity.
  # ---------------------------------------------------------------------------
  spec-gate:
    name: G0 specification integrity
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the CI suite's pinned test dependencies
        # Same defect as the toolchain job, and the same fix. actions/setup-python provides a
        # clean interpreter containing no pytest, so the step below cannot start and exits
        # non-zero before a single test runs. Installed from the one pinned file so every job
        # runs the gates' own tests against the same dependency set.
        run: python -m pip install --disable-pip-version-check -r tests/ci/requirements.txt

      - name: Assert the G0 gate's own tests
        # Same reasoning as the toolchain job: a gate that has quietly stopped rejecting
        # tampering must fail here rather than at the next real integrity incident.
        run: python -m pytest tests/ci/test_spec_gate.py -q

      - name: Run G0 specification integrity gate
        # Exits non-zero on any mechanical failure, and also while human attestation is
        # outstanding, so this job stays red until a named reviewer signs the package.
        # See docs/11_EXECUTION_GATES.md: partial completion is FAIL, not a percentage.
        run: python scripts/verify_spec_gate.py

      - name: Archive gate report
        # docs/09 requires a gate report to record reviewer, commit, timestamp, command
        # output and pass/fail. Retaining the generated report makes the result auditable
        # after the fact rather than only visible in scrollback.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: g0-gate-report-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 90
          path: evidence/gates/

  # ---------------------------------------------------------------------------
  # Go: formatting, vet, build, unit tests.
  # ---------------------------------------------------------------------------
  project-brain:
    name: Project Brain integrity
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the CI suite's pinned test dependencies
        # Same defect as the toolchain job, and the same fix. Without this the job dies in
        # about five seconds with "No module named pytest" and the Project Brain gate below
        # never runs, which is the opposite of what a ledger-integrity job is for.
        run: python -m pip install --disable-pip-version-check -r tests/ci/requirements.txt

      - name: Assert the Project Brain gate's own tests
        # The ledger is what records what this project has verified. If its gate can
        # silently pass, every status claim in the repository becomes unbacked while the
        # ledger still looks healthy, so the gate's own failure modes are tested here.
        run: python -m pytest tests/ci/test_verify_project_brain.py -q

      - name: Verify Project Brain integrity
        # Catches a COMPLETED item citing no evidence, an IN_PROGRESS item that is blocked
        # without saying so, a COMPLETED item whose dependency is incomplete without a
        # stated exemption, and evidence marked partial without an explanation.
        run: python scripts/verify_project_brain.py

  go:
    name: go format + vet + unit
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Verifies the module cache against go.sum, so a tampered download fails here
          # rather than at test time.
          cache: true

      - name: resolve Go modules from the workspace
        # `./...` at the repository root does NOT work in a Go workspace: go.work lists
        # modules in subdirectories, so a root-relative pattern matches no module and the
        # command fails with "directory prefix . does not contain modules listed in
        # go.work". Each module is therefore addressed explicitly.
        #
        # The list comes from `go work edit -json` rather than from parsing go.work with
        # awk/grep. go.work uses a `use (...)` block, so a naive /^use\s+(\S+)/ pattern
        # captures the literal "(" as a module and then silently gates nothing. Letting
        # the Go toolchain emit its own structure also means the block and single-line
        # forms both work, and adding a module needs no workflow edit.
        id: modules
        run: |
          set -euo pipefail
          go work edit -json | jq -r '.Use[].DiskPath' > modules.txt
          count="$(wc -l < modules.txt)"
          if [ "$count" -eq 0 ]; then
            echo "::error::no modules found in go.work; refusing to run an empty gate"
            exit 1
          fi
          echo "resolved $count modules:"
          cat modules.txt
          # Each listed module must actually exist, so a typo in go.work fails loudly here
          # rather than as a confusing "no packages" error later.
          while read -r m; do
            if [ ! -f "$m/go.mod" ]; then
              echo "::error::go.work lists $m but $m/go.mod does not exist"
              exit 1
            fi
          done < modules.txt

      - name: gofmt
        # -l lists unformatted files and exits 0; the diff output is the signal. `-d`
        # alone would exit 0 unconditionally and silently pass.
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt required for:"; echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: go vet
        run: |
          while read -r m; do
            echo "::group::go vet $m"
            go vet "./$m/..."
            echo "::endgroup::"
          done < modules.txt

      - name: go build
        run: |
          while read -r m; do go build "./$m/..."; done < modules.txt

      - name: go test
        # -race is on because the reconciliation and OMS code is concurrency-sensitive;
        # a data race in those paths is a financial-correctness defect, not a lint nit.
        run: |
          while read -r m; do
            echo "::group::go test $m"
            go test -race "./$m/..."
            echo "::endgroup::"
          done < modules.txt

      - name: verify module integrity
        run: |
          while read -r m; do
            (cd "$m" && go mod verify)
          done < modules.txt

      - name: drain tests can fail
        # The three drain tests in cmd/control-plane are what prove G5.7's graceful shutdown
        # ordering, and nothing else in the pipeline establishes that they can fail. A refactor
        # that made one of them assert nothing - against a local, or on a channel nobody closes -
        # would leave the suite green and the claim unverified.
        #
        # This is not hypothetical here. In the same work that added the drain, an earlier draft
        # of the in-flight test passed for the wrong reason: its URL helper omitted the scheme,
        # so every request errored before it was sent and the assertion that the listener had
        # stopped accepting would have passed on a request that never left the process. A test
        # that cannot fail is worse than no test, because it is believed.
        #
        # The gate breaks serve() on purpose - graceful Shutdown replaced by a hard Close, the
        # exact defect the drain prevents - and requires the tests to fail. It restores the file
        # and verifies the restore, and it refuses to run at all if the mutation cannot be applied,
        # so it cannot pass by leaving the code untouched.
        run: python scripts/mutation_check_drain.py

      - name: audit anchor tests can fail
        # The tests in audit/sink_checkpoint_test.go are the only ones that can tell an audit
        # sink which anchors its batch from one which merely appears to. That distinction is
        # recent and load-bearing: the first version of the truncation fix read a partition's
        # latest checkpoint and refused an archive whose head fell behind it, but nothing
        # wrote that table. Every test of the fix inserted its own checkpoint by hand, so the
        # suite was green while a real database would have restored a truncated archive as
        # VERIFIED. These tests drive Export and read back what it actually wrote, which is
        # what makes them capable of seeing a missing producer.
        #
        # Nothing established that they could fail. A refactor that dropped the
        # AppendAuditCheckpoint call, or moved it outside the transaction, would leave the
        # tests passing vacuously and the G5 audit-anchoring claim still reading as verified.
        # The same failure mode EV-064 and EV-065 recorded in the tests themselves: a check
        # that reports success without having exercised anything.
        #
        # The gate makes the sink compute and sign its checkpoints and then discard them, so
        # records are committed that nothing says how far they reach. It requires the tests to
        # notice, credits a detection only on a `--- FAIL` line rather than on a non-zero exit
        # - a package that does not compile also exits non-zero with no test having run - runs
        # a green baseline first so a test already broken at HEAD cannot be mistaken for
        # detection, and restores the file byte-for-byte.
        #
        # scripts/prove_anchor_gate_detects_vacuous.py and
        # scripts/prove_anchor_gate_rejects_build_failure.py hold this gate to the same
        # standard it holds the tests to: both make it fail on purpose, so it has been observed
        # failing rather than only observed passing.
        run: python scripts/mutation_check_anchor.py

      - name: audit fan-out tests can fail
        # docs/22 section 4 requires the authoritative audit stream to reach a distinct account,
        # project and region under object-lock retention, because one database is not independent
        # of the process that writes to it. The Sink interface has always permitted a second
        # destination, but permission is not capability: nothing assembled one, and no test could
        # have failed if the property were dropped, because nothing depended on it. A requirement
        # stated only in a comment is a requirement nobody is checking.
        #
        # audit.FanOut is that capability, and its correctness is several independent promises in
        # different places - the constructor refuses fewer than two destinations, Export does not
        # stop at the first failure, Export does not report success unless every destination
        # stored the batch, every failure is named, an empty batch touches nothing. One mutation
        # would measure a fraction of them and still print PASS, which is the EV-064 shape of a
        # check reporting success without having exercised anything. So this gate runs one
        # mutation per promise and requires each to be noticed.
        #
        # It credits a detection only on a `--- FAIL` line, reusing the classification in
        # mutation_check_anchor.py so the repository holds exactly one definition of the
        # distinction between a test noticing something and a package not building. It adds one
        # check the anchor gate does not need: because these mutations are small textual
        # substitutions inside a shared loop, each one is required to compile before any test is
        # run under it. A mutation that does not compile makes every test in the package exit
        # non-zero with none of them running, which would otherwise be reported as a detection for
        # all of them at once. A malformed mutation is a bug in the gate and is reported as
        # UNCERTIFIED rather than credited.
        #
        # Baseline first, mutation verified as landed before anything is interpreted, file
        # restored byte-for-byte in a finally block.
        run: python scripts/mutation_check_fanout.py

      - name: destructive-migration guard can fail
        # `-direction down` with no -to reverts the whole applied set, and
        # db/migrations/0002_audit.sql's down body is
        # `DROP TABLE IF EXISTS audit_records CASCADE` followed by the rest of the audit schema.
        # That is the tamper-evident chain the platform's compliance story rests on, destroyed by
        # one flag against whatever DATABASE_URL is exported.
        #
        # WI-171 exists because the guard against that lived in
        # integration/harness_test.go, a test file `go run ./cmd/migrate` never executes - a
        # protection present in the repository and absent from the product. The rule moved to
        # migrate/destructive.go and the command consults it before opening a connection.
        #
        # This gate breaks each of the guard's nine promises and requires the matching test to
        # notice: the command consulting it at all, the refusal exiting non-zero, the opt-in not
        # being sufficient alone, the strict policy staying strict, the opt-in being compared
        # exactly, an unnamed database being refused, a redirecting query string being refused,
        # and the refusal naming the database without leaking the password.
        #
        # Two things it holds the tests to that a non-zero exit cannot express. It credits a
        # detection only on a `--- FAIL` line, reusing the classification in
        # mutation_check_anchor.py so there is one definition of "a test noticed" in the
        # repository. And it requires each mutation to compile before running any test under it,
        # because this gate mutates source files that other tests in the package also run: a
        # mutation that does not compile would otherwise make every test in the package exit
        # non-zero with none of them running, reported as a detection for all of them at once.
        #
        # It also takes a backup of both files before mutating anything and repairs from it on the
        # next run if killed. A `finally` block does not run when a CI job times out, and a killed
        # run leaves a mutated production file with nothing marking it - which happened here, and
        # left cmd/migrate permitting a destructive migration on the opt-in alone until the next
        # run's pre-flight check reported a target it could no longer find.
        run: python scripts/mutation_check_destructive_migrate.py

      - name: the G5 gate report is current
        # The G5 report is what a reviewer reads to decide that the gate passed. Until this step
        # existed it was a snapshot with nothing tying it to the code it describes: its digests
        # were correct when written and went stale silently, while the report kept asserting a
        # PASS verdict and a per-criterion mechanically_verified flag. A stale gate report is
        # worse than stale generated code, because it keeps looking authoritative while being
        # wrong about the current tree.
        #
        # The comparison is byte-for-byte against a full regeneration, not a digest
        # recomputation, so a hand-edited verdict is caught as well as a changed source file.
        # It is possible because the report is deterministic: its executed_at is a constant in
        # the generator, not a clock read.
        run: python scripts/generate_g5_gate_report.py --check

  # ---------------------------------------------------------------------------
  # Operator console: typecheck, lint, build.
  # ---------------------------------------------------------------------------
  web:
    name: web typecheck + lint + build
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: install from lockfile
        # `npm ci` (not `npm install`) is the gate. It deletes node_modules and installs
        # strictly from package-lock.json, failing if package.json and the lockfile have
        # drifted apart. That is the "uncommitted lockfile changes" rejection docs/02
        # requires, and it is enforced by npm itself rather than by a custom script.
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Contract validation: the language-neutral corpus, plus every implemented binding.
  # ---------------------------------------------------------------------------
  contracts:
    name: contract validation
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: validate canonical schemas against the shared corpus
        # Every producer and consumer language validates against the same fixture file,
        # so a schema change that breaks one binding breaks CI for all of them
        # (docs/02 section 9).
        run: python tests/contracts/validate_contracts.py

  # ---------------------------------------------------------------------------
  # Python research workers.
  # ---------------------------------------------------------------------------
  python:
    name: python research workers
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: install research worker
        # The [dev] extra is installed explicitly rather than relying on the runner image
        # providing pytest. A test step that invokes a module the job never installed fails
        # only in CI, where it cannot be reproduced locally, so the dependency is made
        # explicit here.
        run: python -m pip install "./workers/research[dev]"

      - name: test research worker
        # Read-only: research workers have no live environment identity and no write
        # path to authoritative financial tables (docs/06 section 4).
        run: python -m pytest workers/research/tests -q

      - name: install backtest worker
        # The backtest worker imports the research worker. Its pyproject declares
        # webtrade-research as a local package rather than a PyPI release, and the two share a
        # dependency set deliberately: a version skew between the research that produced a
        # dataset and the backtest that evaluates it would make a result irreproducible
        # (docs/02 section 10, docs/11 G4). Installing backtest alone would try to resolve that
        # dependency from PyPI and fail, so both are installed together.
        run: python -m pip install "./workers/backtest[dev]"

      - name: test backtest worker
        # Same boundary as the research worker: no credentials, no venue submission, no write
        # path to an authoritative financial table. The backtest additionally produces
        # non-authoritative artifacts only, and asserts that it cannot mark them approved.
        run: python -m pytest workers/backtest/tests -q

      - name: lint python workers
        # ruff and mypy strict are configured per worker rather than once at the root, because
        # the workers have separate dependency sets and separate boundaries.
        run: |
          python -m ruff check workers/research workers/backtest
          python -m mypy workers/research/src
          python -m mypy workers/backtest/src
  # ---------------------------------------------------------------------------
  # SAST.
  # ---------------------------------------------------------------------------
  sast:
    name: SAST (CodeQL)
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Required for the security-events API. Scoped to this job only.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: initialise CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          language: ${{ matrix.language }}
          queries: security-extended

      # CodeQL needs the build to have happened to trace data flow. For compiled
      # languages the build is performed by the action rather than by the project, so
      # this does not re-run the project test suite.
      - name: analyse
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}

  # ---------------------------------------------------------------------------
  # Dependency and license scanning.
  # ---------------------------------------------------------------------------
  dependency-scan:
    name: dependency + license scan
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: resolve Go modules for scanning
        # Same root-relative `./...` trap as the go job: it matches no module in this
        # workspace. The action takes a pattern, so the resolved modules are joined into
        # one comma-separated list.
        id: modules
        run: |
          set -euo pipefail
          packages="$(go work edit -json | jq -r '[.Use[].DiskPath | ".\(.)/..."] | join(",")')"
          if [ -z "$packages" ]; then
            echo "::error::no modules resolved from go.work"
            exit 1
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "scanning: $packages"

      - name: go vulnerability scan
        # govulncheck is reachability-aware: it reports only vulnerabilities on a path
        # the code can actually take, which keeps the signal usable at a blocking gate.
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: ${{ env.GO_VERSION }}
          go-package: ${{ steps.modules.outputs.packages }}

      - name: install audited dependencies
        working-directory: apps/web
        run: npm ci

      - name: npm audit
        working-directory: apps/web
        # --audit-level=high implements the docs/06 target: critical/high findings block,
        # lower severities are reported for the monthly security review.
        run: npm audit --audit-level=high

      - name: python dependency scan
        # Both workers are scanned. A dependency is the most likely way either worker gains a
        # capability its authority boundary forbids, since adding a package grants the
        # capability without any source file importing it yet.
        run: |
          python -m pip install pip-audit
          python -m pip install "./workers/research[dev]" "./workers/backtest[dev]"
          python -m pip_audit --strict

      - name: license scan
        # docs/02 requires dependency and license scanning. A permissive-licence
        # violation is a legal exposure, so it blocks like a vulnerability does.
        run: |
          python -m pip install liccheck
          liccheck \
            --project workers/research \
            --format plain \
            --fail-level warn \
            --allowed-licenses MIT Apache-2.0 BSD-3-Clause
          liccheck \
            --project workers/backtest \
            --format plain \
            --fail-level warn \
            --allowed-licenses MIT Apache-2.0 BSD-3-Clause

  # ---------------------------------------------------------------------------
  # Secret scanning. Mandatory per docs/06 section 7.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: secret scan
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret that was committed and later removed is still exposed,
          # and removing it from the tip does not revoke it.
          fetch-depth: 0
          persist-credentials: false

      - name: scan repository history for secrets
        # Run as a pinned container image rather than the vendor's hosted action. The
        # hosted action requires a GITLEAKS_LICENSE for organisation repositories and
        # *skips silently* without one, which is indistinguishable from a clean scan;
        # running the binary directly has no licence gate and no silent-skip mode, so a
        # green result always means the scan actually ran.
        #
        # The image is pinned to an exact release tag. `detect` is the subcommand that
        # scans git history; `--redact` keeps any match value out of the log, because a
        # CI log is a poor place to reprint a discovered credential.
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1 \
            detect \
              --source /repo \
              --redact \
              --verbose \
              --no-banner \
              --exit-code 1

      - name: assert the scanner actually ran
        # Defensive: if the container is skipped, pulled, or replaced by a no-op, the
        # step above could report success without scanning anything. Requiring a
        # sentinel written by the same image makes a skipped scan fail loudly.
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1 \
            version > /dev/null || {
              echo "::error::gitleaks image did not execute; secret scan cannot be recorded as passing"
              exit 1
            }

  # ---------------------------------------------------------------------------
  # Integration tests and artifact build: protected branch only.
  # ---------------------------------------------------------------------------
  integration:
    name: integration (protected branch)
    needs: [toolchain, go, contracts, python]
    # docs/09: protected branches *additionally* require integration tests and artifact
    # build. Running them on every PR as well would waste minutes before a branch is
    # even eligible for protection review.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: webtrade
          POSTGRES_PASSWORD: webtrade
          POSTGRES_DB: webtrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webtrade"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://webtrade:webtrade@localhost:5432/webtrade_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: resolve Go modules from the workspace
        run: |
          set -euo pipefail
          go work edit -json | jq -r '.Use[].DiskPath' > modules.txt
          test -s modules.txt || { echo "::error::no modules in go.work"; exit 1; }
          cat modules.txt

      - name: migration rehearsal
        # docs/09 lists migration rehearsal as a release-candidate gate. It runs here too
        # because a migration that cannot apply, or cannot be reverted, is a rollback-blocking
        # defect and must be caught before the branch is protected.
        #
        # This spins up its own disposable PostgreSQL and proves the whole set applies, reverts
        # to a clean catalog, and applies again. That is a different property from the step
        # below: this one destroys its database afterwards, so it says nothing about whether
        # the long-lived integration database has a schema. Both are kept, and the reason they
        # are no longer alternatives is recorded here rather than left to be rediscovered.
        #
        # It used to be the only option. The comment it replaced argued that cmd/migrate could
        # not run because no Go PostgreSQL driver could be admitted: pgx pulls
        # github.com/jackc/pgservicefile, which has only pseudo-versions, and
        # scripts/verify_toolchain.py refuses those as unpinned references. That was a real
        # constraint and it was reasoned about rather than measured, which is how it stayed
        # wrong. EV-060 tested candidates against the unmodified gate and found
        # github.com/lib/pq v1.10.9 passes with an empty transitive closure, so the driver is
        # adopted and this step is a rehearsal rather than a substitute.
        run: python scripts/rehearse_migrations.py

      - name: apply migrations to the integration database
        # The integration tests below open this service's database directly and do not create
        # its schema; the harness expects to find tables already there. The rehearsal cannot
        # provide them because it discards its own container on exit, so without this step the
        # whole integration job fails on a missing relation rather than on anything about the
        # code under test.
        #
        # Run through the real CLI rather than the rehearsal helper, so the command an operator
        # runs is the command CI exercises. That includes its exit codes: a drift disagreement
        # exits 1 and a configuration problem exits 2, and either fails this step.
        #
        # -direction up is idempotent against an already-current database, so re-running the
        # job without recreating the service is not a failure.
        run: go run ./services/control-plane/cmd/migrate -direction up

      - name: sqlc is up to date
        # A generated file that no longer matches its inputs builds fine and behaves
        # unexpectedly. Regenerating and failing on a diff is the only check that notices.
        #
        # sqlc is installed at the same pinned version that generated the checked-in files;
        # the version is recorded in the generated header and asserted by
        # services/control-plane/db/contract/contract_test.go.
        #
        # The tracking check is not redundant. `git diff` only compares tracked files, so if
        # the generated output were never committed this step would pass forever while
        # nothing enforced that the code exists in the repository at all.
        run: |
          set -euo pipefail
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.29.0
          if ! git ls-files --error-unmatch services/control-plane/db/dbgen >/dev/null 2>&1; then
            echo "::error::generated sqlc output is not tracked; commit services/control-plane/db/dbgen"
            exit 1
          fi
          "$(go env GOPATH)/bin/sqlc" generate
          git diff --exit-code -- services/control-plane/db/dbgen \
            || { echo "::error::sqlc output is stale; run 'sqlc generate' and commit"; exit 1; }

      - name: sqlc vet
        # A block scalar rather than `run: "$(go env GOPATH)/bin/sqlc" vet`. YAML reads the
        # double quotes as a complete scalar and then fails on the trailing `vet`, which
        # breaks every other test that parses this workflow too.
        run: |
          "$(go env GOPATH)/bin/sqlc" vet

      - name: the live database is actually reachable
        # The integration suite skips rather than fails when DATABASE_URL is absent, so that a
        # developer running the tag locally without a database sees a skip instead of a false
        # failure. That is the right default and it is deliberate.
        #
        # The cost is that a missing or unreachable database in *this* job would skip all
        # seventeen tests and still report success, which is worse than useless: it would certify
        # a gate that verified nothing. The suite's own comment says a skip here means the job
        # lost its service and the run is already failed - but nothing enforced that, it was only
        # asserted in a comment. This step is the enforcement, and it exists because that
        # assumption was in fact violated in local verification: the same suite was invoked with
        # TEST_DATABASE_URL instead of DATABASE_URL, skipped entirely, printed "ok", and exited 0.
        # A check that reports success having executed none of itself is the failure mode this
        # repository has now recorded three times, so the invariant is checked rather than
        # assumed.
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}" || {
            echo "::error::DATABASE_URL is not set; every integration test would skip and this job would pass without running any of them"
            exit 1
          }
          go run ./services/control-plane/cmd/migrate -direction status

      - name: integration tests
        # Per module, for the same workspace reason as the go job: a root-relative
        # `./...` matches no module here.
        run: |
          while read -r m; do
            echo "::group::integration $m"
            go test -tags=integration -race "./$m/..."
            echo "::endgroup::"
          done < modules.txt

      - name: the live migration tests actually ran
        # WI-175. Three packages hold tests that skip when DATABASE_URL is absent, and `go test`
        # prints "ok" whether it ran them or skipped them:
        #
        #   cmd/migrate   main_test.go:114      - six live tests calling disposableDSN
        #   migrate       live_test.go:36       - the live migration tests
        #   integration   harness_test.go:51, destructive_guard_test.go:280,
        #                 entrypoint_test.go:495
        #
        # None carry a build tag, so they also compile into the `go` job - which has no database
        # and no DATABASE_URL, and therefore skipped all of them while reporting a clean package
        # result. The integration job does run them, so coverage was not lost, but a job that
        # reports success having executed none of itself is the specific failure this repository
        # has now recorded repeatedly, and here it was reachable by deleting one environment
        # variable.
        #
        # This job already proves DATABASE_URL is set and reachable, so a skip here cannot mean
        # "no database configured". It can only mean the tests certified nothing.
        #
        # Failing on *any* skip is deliberate and is exact rather than approximate: within these
        # three packages every t.Skip is a DATABASE_URL skip, verified by search. If a genuinely
        # legitimate skip is ever added, this fails loudly and the exemption gets written down
        # here instead of being assumed.
        run: |
          set -euo pipefail
          check_no_skips() {
            local label="$1"; shift
            local out
            if ! out="$(go test -count=1 -v "$@" 2>&1)"; then
              echo "$out"
              exit 1
            fi
            echo "::group::$label"
            echo "$out"
            echo "::endgroup::"
            if printf '%s\n' "$out" | grep -q '^--- SKIP'; then
              echo "::error::$label skipped tests even though DATABASE_URL is set and reachable; those tests verified nothing"
              printf '%s\n' "$out" | grep '^--- SKIP'
              exit 1
            fi
          }
          check_no_skips "cmd/migrate live tests" ./services/control-plane/cmd/migrate/...
          check_no_skips "migrate live tests"      ./services/control-plane/migrate/...
          check_no_skips "integration tests"       -tags=integration ./services/control-plane/integration/...
          printf 'all live-database tests ran; none skipped\n'

  artifact:
    name: artifact build (protected branch)
    needs: [toolchain, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Build attestations are written to the registry, not the repo.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: build operator console image
        # No `push` step. The protected branch produces a verified, attested artifact and
        # stops. Publication is a separate, environment-gated promotion (dev -> test ->
        # staging -> paper -> shadow -> live), because a green CI run is not a decision
        # to deploy.
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/web
          push: false
          load: true
          tags: webtrade/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: generate SBOM
        # docs/02 section 10: an SBOM per release artifact. Generated here in addition to
        # BuildKit's own SBOM so the artifact has a detached, attestable SBOM.
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: webtrade/web:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: sign and attest provenance
        # Keyless: OIDC identity from this workflow run, no long-lived signing key to
        # protect. Attestation binds artifact digest, source revision and build identity
        # (docs/02 section 10).
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate-type https://slsa.dev/provenance/v1 \
            --type github \
            webtrade/web@${IMAGE_DIGEST}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.sha }}
          # Uploaded even on failure: a failed release-candidate attempt is still
          # evidence for the release record (docs/09 "Evidence package").
          if-no-files-found: error
          retention-days: 90
          path: |
            sbom.spdx.json
